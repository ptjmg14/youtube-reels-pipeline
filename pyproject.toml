[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-reels-pipeline"
version = "0.1.0"
description = "Local-first YouTube to vertical short-video pipeline"
requires-python = ">=3.11,<3.15"
dependencies = [
    "yt-dlp>=2025.1.15",
    "python-dotenv>=1.0.1",
    "imageio-ffmpeg>=0.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1.1", "edge-tts>=6.1.0", "matplotlib>=3.9.0"]
index = ["chromadb>=1.5.0,<2.0.0"]
pinecone = ["pinecone>=10.0.0"]
gemini = ["google-genai>=1.0.0"]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[project.scripts]
reels = "youtube_reels.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
